name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo compatibility
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Check beta smoke script
        run: node --check scripts/beta-smoke.js

      - name: Run Phase 1 verification
        run: npm run test:phase1

      - name: Run Phase 3 verification
        run: npm run test:phase3

      - name: Run Phase 8 resilience checks
        run: npm run test:phase8

      - name: Run Phase 9 launch-gate checks
        run: npm run test:phase9

      - name: Run Phase 10 final acceptance checks
        run: npm run test:phase10

      - name: Run Phase 11 controlled beta checks
        run: npm run test:phase11

      - name: Run Phase 12 account and Android checks
        run: npm run test:phase12

      - name: Run Phase 13 authentication checks
        run: npm run test:phase13

      - name: Run Phase 14 cloud sync checks
        run: npm run test:phase14

      - name: Run Phase 15 release validation checks
        run: npm run test:phase15

      - name: Run Phase 16 account isolation checks
        run: npm run test:phase16

      - name: Run Phase 17 release preflight checks
        run: npm run test:phase17

      - name: Run Phase 18 account deletion checks
        run: npm run test:phase18

      - name: Run Phase 19 Android release checks
        run: npm run test:phase19

      - name: Run Phase 20 support diagnostics checks
        run: npm run test:phase20

      - name: Run Phase 21 empty-state checks
        run: npm run test:phase21

      - name: Run Phase 22 accessibility checks
        run: npm run test:phase22

      - name: Run Phase 23 storage recovery checks
        run: npm run test:phase23

      - name: Run review verification
        run: npm run test:review

      - name: Run mascot verification
        run: npm run test:owl

      - name: Build web bundle
        run: npm run build:web

      - name: Run server hardening tests
        run: npm run test:server

      - name: Run release smoke contract
        run: npm run test:release

      - name: Generate dependency audit report
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
