name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run phase verification
        run: npm run test:phase3

      - name: Build web bundle
        run: npm run build:web

      - name: Run server hardening tests
        run: npm run test:server

      - name: Run release smoke contract
        run: npm run test:release

      - name: Generate dependency audit report
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
